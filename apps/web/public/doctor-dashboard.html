<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physician Clinical Dashboard — AIRO eMed</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>

<body class="bg-[#F3F1EC] text-[#191817] font-sans antialiased min-h-screen flex flex-col">

  <!-- PHYSICIAN PORTAL HEADER -->
  <header class="sticky top-0 z-50 bg-[#0F1B38] text-white border-b border-white/10">
    <div class="max-w-[2000px] mx-auto w-full px-4 sm:px-8 lg:px-12 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <a href="/" class="flex items-baseline space-x-1.5 select-none">
          <span class="font-extrabold text-2xl tracking-tight text-white">AIRO</span>
          <span class="text-xl font-normal text-white/80 tracking-tight">eMed</span>
        </a>
        <span class="px-3 py-1 rounded-full bg-white/10 text-[#E89D5E] text-[11px] font-bold uppercase tracking-wider">
          Physician Dashboard
        </span>
      </div>

      <div class="flex items-center space-x-4">
        <div class="hidden sm:flex items-center space-x-2.5 text-xs">
          <img src="/images/doctor-avatar.jpg" alt="Dr. Sarah Jenkins" class="w-8 h-8 rounded-full object-cover border border-white/30" />
          <span class="font-semibold">Dr. Sarah Jenkins, MD</span>
        </div>
        <a href="/shop.html" class="px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 text-xs font-semibold transition-colors">
          View Storefront
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- LEFT: PATIENT REVIEW QUEUE -->
      <aside class="lg:col-span-4 bg-white rounded-[24px] border border-[#EAE5DC] p-5 sm:p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h1 class="text-lg font-bold text-[#191817]">Patient Review Queue</h1>
          <span id="queue-count" class="px-2.5 py-0.5 rounded-full bg-[#0F1B38] text-white text-xs font-bold">0</span>
        </div>
        <div id="doctor-queue-list" class="space-y-2.5"></div>
      </aside>

      <!-- RIGHT: ACTIVE PATIENT CASE & ACTIONS -->
      <section id="doctor-case-panel" class="lg:col-span-8 space-y-6">
        <!-- Populated dynamically -->
      </section>

    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    let selectedOrderId = null;

    function getOrders() {
      let orders = JSON.parse(localStorage.getItem('airo_orders_v1') || '[]');
      if (!orders.length) {
        orders = [{
          orderId: 'AIRO-8421',
          status: 'PENDING_DOCTOR_REVIEW',
          createdAt: new Date().toISOString(),
          patient: { name: 'Alex Morgan', email: 'alex.morgan@example.com', phone: '+1 (555) 234-5678' },
          shipping: { street: '240 Mercer Street, Apt 4B', city: 'Jersey City', state: 'NJ', zip: '07302' },
          category: 'HAIR',
          audience: 'HIM',
          concerns: ['Receding Hairline'],
          dob: '1995-05-08',
          aiOverview: 'AI Clinical Analysis reviewed patient hair profile (Receding Hairline) and safety screen. Dual/triple-active DHT-blocking therapy recommended.',
          medicines: [{
            id: 'airo-airo-root-advance',
            title: 'AIRO Root Advance™',
            ingredients: 'Minoxidil 8% + Dutasteride 0.25% + Tretinoin 0.1%',
            priceInr: 1499,
            image: '/images/airo_opt/med-51-airo-her-products-image-04-1790631088568-61708b29.jpg',
            qty: 1,
            addedByDoctor: false
          }],
          callRequest: null,
          doctorNote: '',
          chatMessages: []
        }];
        localStorage.setItem('airo_orders_v1', JSON.stringify(orders));
      }
      return orders;
    }

    function saveOrders(orders) {
      localStorage.setItem('airo_orders_v1', JSON.stringify(orders));
      renderDashboard();
    }

    function selectOrder(orderId) {
      selectedOrderId = orderId;
      renderDashboard();
    }

    function approveOrder(orderId) {
      const orders = getOrders();
      const order = orders.find(o => o.orderId === orderId);
      if (!order) return;
      order.status = 'APPROVED';
      order.callRequest = null;
      const noteInp = document.getElementById('doc-clinical-note');
      if (noteInp && noteInp.value.trim()) {
        order.doctorNote = noteInp.value.trim();
      } else if (!order.doctorNote) {
        order.doctorNote = 'Approved following asynchronous clinical evaluation. Follow daily dosing instructions.';
      }
      saveOrders(orders);
    }

    function startConsultCall(orderId, type) {
      const orders = getOrders();
      const order = orders.find(o => o.orderId === orderId);
      if (!order) return;
      order.callRequest = type; // 'VIDEO' or 'AUDIO'
      order.chatMessages = order.chatMessages || [];
      if (!order.chatMessages.some(m => m.text.includes('started a'))) {
        order.chatMessages.push({
          sender: 'DOCTOR',
          text: `Dr. Sarah Jenkins started a ${type.toLowerCase()} consultation to review your treatment plan.`,
          at: new Date().toISOString()
        });
      }
      saveOrders(orders);
    }

    function endDoctorCall(orderId) {
      const orders = getOrders();
      const order = orders.find(o => o.orderId === orderId);
      if (!order) return;
      order.callRequest = null;
      saveOrders(orders);
    }

    function sendDoctorChat(orderId) {
      const inp = document.getElementById('doc-chat-input');
      const txt = inp ? inp.value.trim() : '';
      if (!txt) return;
      const orders = getOrders();
      const order = orders.find(o => o.orderId === orderId);
      if (!order) return;
      order.chatMessages = order.chatMessages || [];
      order.chatMessages.push({ sender: 'DOCTOR', text: txt, at: new Date().toISOString() });
      saveOrders(orders);
    }

    function addMedicineToOrder(orderId) {
      const sel = document.getElementById('doc-add-med-select');
      const medId = sel ? sel.value : '';
      if (!medId || typeof PRODUCTS === 'undefined') return;
      const prod = PRODUCTS.find(p => p.id === medId);
      if (!prod) return;

      const orders = getOrders();
      const order = orders.find(o => o.orderId === orderId);
      if (!order) return;

      const noteInp = document.getElementById('doc-clinical-note');
      if (noteInp && noteInp.value.trim()) {
        order.doctorNote = noteInp.value.trim();
      }

      order.medicines.push({
        id: prod.id,
        title: prod.title,
        ingredients: prod.ingredients,
        priceInr: prod.priceInr || 999,
        image: prod.image,
        qty: 1,
        addedByDoctor: true
      });
      saveOrders(orders);
    }

    function renderDashboard() {
      const orders = getOrders();
      const urlParams = new URLSearchParams(window.location.search);
      const paramOrder = urlParams.get('orderId');
      if (!selectedOrderId) {
        selectedOrderId = (paramOrder && orders.some(o => o.orderId === paramOrder)) ? paramOrder : orders[0].orderId;
      }

      document.getElementById('queue-count').textContent = orders.length;
      document.getElementById('doctor-queue-list').innerHTML = orders.map(o => {
        const isSelected = o.orderId === selectedOrderId;
        const statusColor = o.status === 'APPROVED'
          ? 'bg-emerald-100 text-emerald-800'
          : o.callRequest
          ? 'bg-blue-100 text-blue-800'
          : 'bg-amber-100 text-amber-800';
        const statusText = o.status === 'APPROVED' ? 'Approved' : o.callRequest ? `${o.callRequest} Call` : 'Needs Review';

        return `
          <button onclick="selectOrder('${o.orderId}')"
            class="w-full text-left p-4 rounded-2xl border transition-all cursor-pointer ${isSelected ? 'border-[#0F1B38] bg-[#FAF8F5]' : 'border-[#EAE5DC] hover:bg-[#FAF8F5]'}">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono font-bold text-[#6E6860]">#${o.orderId}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusColor}">${statusText}</span>
            </div>
            <div class="text-sm font-bold text-[#191817] mt-1">${o.patient.name}</div>
            <div class="text-xs text-[#6E6860] mt-0.5">${o.category} · ${o.medicines.length} medicine(s)</div>
          </button>
        `;
      }).join('');

      const order = orders.find(o => o.orderId === selectedOrderId) || orders[0];
      const allProds = (typeof PRODUCTS !== 'undefined') ? PRODUCTS : [];

      document.getElementById('doctor-case-panel').innerHTML = `
        <!-- Case Header & Direct Approval / Call Actions -->
        <div class="bg-white rounded-[24px] border border-[#EAE5DC] p-6 sm:p-8 space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-[#EAE5DC]">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-widest text-[#C8623D]">Case #${order.orderId} · ${order.shipping.state} Jurisdiction</span>
              <h2 class="text-2xl font-serif font-bold text-[#191817] mt-1">${order.patient.name}</h2>
              <p class="text-xs text-[#6E6860] mt-0.5">DOB: ${order.dob} · ${order.patient.email} · ${order.patient.phone}</p>
            </div>

            <div class="flex flex-wrap gap-2.5">
              <button onclick="startConsultCall('${order.orderId}', 'VIDEO')"
                class="px-4 py-2.5 rounded-full bg-[#EFECE6] hover:bg-[#DDD5C9] text-[#191817] text-xs font-bold cursor-pointer">
                📹 Virtual Video Call
              </button>
              <button onclick="startConsultCall('${order.orderId}', 'AUDIO')"
                class="px-4 py-2.5 rounded-full bg-[#EFECE6] hover:bg-[#DDD5C9] text-[#191817] text-xs font-bold cursor-pointer">
                🎙️ Audio Call
              </button>
              <button onclick="approveOrder('${order.orderId}')"
                class="px-6 py-2.5 rounded-full ${order.status === 'APPROVED' ? 'bg-emerald-600 text-white' : 'bg-[#0F1B38] hover:bg-[#1E40AF] text-white'} text-xs font-bold cursor-pointer">
                ${order.status === 'APPROVED' ? '✓ Approved & Dispatched' : '✓ Approve Medicines Directly'}
              </button>
            </div>
          </div>

          <!-- AI Clinical Overview -->
          <div class="bg-[#FAF8F5] rounded-2xl p-5 border border-[#EAE5DC]">
            <span class="text-[10px] font-bold uppercase tracking-widest text-[#0F1B38] block mb-1">AI Clinical Overview &amp; Patient Concerns</span>
            <p class="text-sm text-[#191817] leading-relaxed">${order.aiOverview || 'Patient completed clinical intake.'}</p>
            <div class="mt-3 flex flex-wrap gap-2">
              ${(order.concerns || []).map(c => `<span class="px-2.5 py-1 rounded-full bg-white border border-[#DDD5C9] text-[11px] font-semibold">${c}</span>`).join('')}
            </div>
          </div>

          <!-- Active Virtual Video / Audio Panel (when call active) -->
          ${order.callRequest ? `
            <div class="bg-[#0F1B38] text-white rounded-2xl p-6 space-y-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span class="text-sm font-bold">${order.callRequest === 'VIDEO' ? 'Live Virtual Video Session' : 'Live Audio Consultation'} with ${order.patient.name}</span>
                </div>
                <button onclick="endDoctorCall('${order.orderId}')" class="px-3.5 py-1.5 rounded-full bg-red-600 text-xs font-bold cursor-pointer">End Call</button>
              </div>
              <div class="bg-white/10 rounded-xl p-4 space-y-2 max-h-40 overflow-y-auto text-xs">
                ${(order.chatMessages || []).map(m => `
                  <div class="${m.sender === 'DOCTOR' ? 'text-amber-200' : 'text-white'}">
                    <strong>${m.sender === 'DOCTOR' ? 'You' : order.patient.name}:</strong> ${m.text}
                  </div>
                `).join('')}
              </div>
              <div class="flex space-x-2">
                <input id="doc-chat-input" type="text" placeholder="Send clinical message to patient..."
                  class="flex-1 px-3 py-2 rounded-xl bg-white text-[#191817] text-xs focus:outline-none" />
                <button onclick="sendDoctorChat('${order.orderId}')" class="px-4 py-2 rounded-xl bg-[#E89D5E] text-[#191714] text-xs font-bold cursor-pointer">Send</button>
              </div>
            </div>
          ` : ''}

          <!-- Current Prescription & Add Additional Medicines -->
          <div class="space-y-4">
            <h3 class="text-base font-bold text-[#191817]">Current Ordered Medicines (${order.medicines.length})</h3>
            <div class="space-y-2.5">
              ${order.medicines.map(m => `
                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-[#FAF8F5] border border-[#EAE5DC]">
                  <div class="flex items-center space-x-3">
                    <img src="${m.image}" alt="${m.title}" class="w-12 h-12 rounded-xl object-cover" />
                    <div>
                      <div class="flex items-center space-x-2">
                        <span class="text-sm font-bold text-[#191817]">${m.title}</span>
                        ${m.addedByDoctor ? '<span class="px-2 py-0.5 rounded-full bg-[#E89D5E] text-[#191714] text-[10px] font-bold">Added by Doctor</span>' : ''}
                      </div>
                      <span class="text-xs font-mono text-[#6E6860]">${m.ingredients}</span>
                    </div>
                  </div>
                  <span class="text-sm font-bold tabular-nums">₹${(m.priceInr || 999).toLocaleString('en-IN')}</span>
                </div>
              `).join('')}
            </div>

            <!-- Add Additional Medicine Form -->
            <div class="pt-4 border-t border-[#EAE5DC] space-y-3">
              <label class="block text-xs font-bold uppercase tracking-wider text-[#191817]">Add Additional Medicine to Prescription</label>
              <div class="flex flex-col sm:flex-row gap-3">
                <select id="doc-add-med-select" class="flex-1 px-4 py-2.5 rounded-xl bg-[#FAF8F5] border border-[#DDD5C9] text-sm font-medium focus:outline-none">
                  ${allProds.map(p => `<option value="${p.id}">${p.title} (${p.ingredients}) — ₹${p.priceInr}</option>`).join('')}
                </select>
                <button onclick="addMedicineToOrder('${order.orderId}')"
                  class="px-5 py-2.5 rounded-full bg-[#0F1B38] hover:bg-[#1E40AF] text-white text-xs font-bold cursor-pointer shrink-0">
                  + Add Medicine
                </button>
              </div>
              <textarea id="doc-clinical-note" rows="2" placeholder="Optional clinical dosage note for patient..."
                class="w-full px-4 py-2.5 rounded-xl bg-[#FAF8F5] border border-[#DDD5C9] text-xs focus:outline-none">${order.doctorNote || ''}</textarea>
            </div>
          </div>
        </div>
      `;
    }

    window.addEventListener('storage', () => renderDashboard());
    document.addEventListener('DOMContentLoaded', renderDashboard);
  </script>
</body>

</html>
