  <!-- Core App Stylesheet -->

  <style>
    /* Questionnaire Dedicated Polished Styles */
    body {
      background-color: #FAF8F5;
      color: #191817;
    }

    .q-card-option {
      border: 1.5px solid #DDD5C9;
      background-color: #FFFFFF;
      border-radius: 1.25rem;
      padding: 1.1rem 1.25rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .q-card-option:hover {
      border-color: #191817;
      background-color: #F7F5F0;
      transform: translateY(-1px);
    }

    .q-card-option.selected {
      border-color: #0F1B38;
      background-color: #F0F4FF;
      box-shadow: 0 4px 14px -2px rgba(15, 27, 56, 0.12);
    }

    .q-photo-card {
      border: 1.5px solid #DDD5C9;
      background-color: #FFFFFF;
      border-radius: 1.25rem;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .q-photo-card:hover {
      border-color: #191817;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px -4px rgba(25, 24, 23, 0.08);
    }

    .q-photo-card.selected {
      border-color: #0F1B38;
      box-shadow: 0 0 0 2px #0F1B38, 0 10px 24px -4px rgba(15, 27, 56, 0.16);
      background-color: #F0F4FF;
    }

    .q-photo-card.selected .check-indicator {
      display: flex;
    }

    .q-why-box {
      background-color: #F4EFE6;
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      border: 1px solid #E5DEC9;
    }

    .q-safety-box {
      background-color: #FEF2F2;
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      border: 1px solid #FCA5A5;
      color: #991B1B;
    }

    .upload-dropzone {
      border: 2px dashed #DDD5C9;
      background-color: #FFFFFF;
      border-radius: 1.25rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .upload-dropzone:hover {
      border-color: #0F1B38;
      background-color: #F7F5F0;
    }

    .upload-dropzone.has-file {
      border-color: #10B981;
      background-color: #ECFDF5;
    }

    .q-btn-navy {
      background-color: #0F1B38;
      color: #FFFFFF;
      border-radius: 9999px;
      font-weight: 700;
      padding: 0.95rem 2.25rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(15, 27, 56, 0.2);
    }

    .q-btn-navy:hover:not(:disabled) {
      background-color: #000000;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15, 27, 56, 0.3);
    }

    .q-btn-navy:disabled {
      background-color: #C7C2BA;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Interstitial Animated Text Styles (Matching Reference Image 3) */
    @keyframes wordFadeUp {
      0% {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .animate-word {
      display: inline-block;
      opacity: 0;
      animation: wordFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .highlight-pill {
      display: inline-block;
      background-color: #F1ECE3;
      color: #9E4D30;
      padding: 0.15rem 0.55rem;
      border-radius: 0.5rem;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(158, 77, 48, 0.06);
      opacity: 0;
      animation: wordFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeIn {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .interstitial-wrap {
      animation: cardFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

  <script>
    // ----------------------------------------------------

    // ----------------------------------------------------
    const HAIR_CONCERNS_MEN = [
      { id: 'male-pattern-hair-loss', title: 'Male pattern hair loss', image: '/images/concerns/hims/male-pattern-hair-loss.png' },
      { id: 'receding-hairline', title: 'Receding Hairline', image: '/images/concerns/hims/receding-hairline.png' },
      { id: 'deep-receding-hairline', title: 'Deep Receding Hairline', image: '/images/concerns/hims/deep-receding-hairline.png' },
      { id: 'thinning-hair', title: 'Thinning Hair', image: '/images/concerns/hims/thinning-hair.png' },
      { id: 'crown-hair-loss', title: 'Crown Hair Loss', image: '/images/concerns/hims/crown-hair-loss.png' },
      { id: 'crown-balding', title: 'Crown Balding Spot', image: '/images/concerns/hims/crown-balding.png' },
      { id: 'patchy-hair-loss', title: 'Patchy Hair Loss', image: '/images/concerns/hims/patchy-hair-loss.png' },
      { id: 'hair-shedding', title: 'Excessive Hair Shedding', image: '/images/concerns/hims/hair-shedding.png' },

      { id: 'prevent-hair-loss', title: 'Prevent Hair Loss', image: '/images/concerns/hims/prevent-hair-loss.png' },
      { id: 'not-sure', title: 'Not Sure', image: '/images/intake/concern-not-sure.jpg' }
    ];

    const HAIR_CONCERNS_WOMEN = [
      { id: 'female-pattern-thinning', title: 'Female Pattern Thinning', image: '/images/concerns/hers/female-pattern-thinning.png' },
      { id: 'part-line-widening', title: 'Part Line Widening', image: '/images/concerns/hers/part-line-widening.png' },
      { id: 'part-line-widening-moderate', title: 'Moderate Part Widening', image: '/images/concerns/hers/part-line-widening-moderate.png' },
      { id: 'diffuse-thinning', title: 'Diffuse Thinning Along Part', image: '/images/concerns/hers/diffuse-thinning.png' },
      { id: 'receding-hairline', title: 'Receding Frontal Hairline', image: '/images/concerns/hers/receding-hairline.png' },
      { id: 'hair-shedding', title: 'Excessive Daily Shedding', image: '/images/concerns/hers/hair-shedding.png' },
      { id: 'postpartum-shedding', title: 'Postpartum Hair Shedding', image: '/images/concerns/hers/postpartum-shedding.png' },
      { id: 'patchy-loss', title: 'Patchy Hair Loss', image: '/images/concerns/hers/patchy-hair-loss.png' },
      { id: 'weak-damaged-hair', title: 'Weak, Brittle & Split Ends', image: '/images/concerns/hers/weak-damaged-hair.png' },
      { id: 'prevent-thinning', title: 'Prevent Hair Loss', image: '/images/concerns/hers/prevent-hair-loss.png' },
      { id: 'not-sure-w', title: 'Not Sure', image: '/images/intake/concern-not-sure.jpg' }
    ];

    const SEXUAL_HEALTH_CONCERNS = [
      { id: 'erectile-dysfunction', title: 'Erectile Dysfunction (ED)', image: '/images/concerns/sexual/erectile-dysfunction.jpg' },
      { id: 'premature-ejaculation', title: 'Premature Ejaculation (PE)', image: '/images/concerns/sexual/premature-ejaculation.jpg' },
      { id: 'both-ed-pe', title: 'Both Performance & Control', image: '/images/card-prod-sildenafil.jpg' }
    ];

    const SKIN_CONCERNS_MEN = [
      { id: 'dark-spots', title: 'Dark Spots & Melasma', image: '/images/card-prod-glow-serum.jpg' },
      { id: 'acne', title: 'Acne & Breakouts', image: '/images/card-prod-clear-gel.jpg' },
      { id: 'anti-aging', title: 'Anti-Aging & Fine Lines', image: '/images/card-prod-tretinoin.jpg' },
      { id: 'body', title: 'Body Skin Concerns', image: '/images/cat-skin.jpg' },
      { id: 'rosacea', title: 'Redness & Rosacea', image: '/images/slide-0-skin.jpg' },
      { id: 'sleep-skin', title: 'Sleep & Night Recovery', image: '/images/slide-skin.jpg' },
      { id: 'longevity', title: 'Cellular Longevity', image: '/images/hero-skin.jpg' }
    ];

    const SKIN_CONCERNS_WOMEN = [
      { id: 'dark-spots', title: 'Dark Spots & Hyperpigmentation', image: '/images/card-prod-glow-serum.jpg' },
      { id: 'anti-aging', title: 'Anti-Aging & Wrinkles', image: '/images/card-prod-tretinoin.jpg' },
      { id: 'rosacea', title: 'Redness & Rosacea', image: '/images/slide-0-skin.jpg' },
      { id: 'body', title: 'Body Acne & Texture', image: '/images/cat-skin.jpg' },
      { id: 'acne', title: 'Adult & Hormonal Acne', image: '/images/card-prod-clear-gel.jpg' },
      { id: 'unwanted-facial-hair', title: 'Unwanted Facial Hair', image: '/images/womens-hair-seed.jpg' },
      { id: 'menopause-skin', title: 'Menopause Skin Care', image: '/images/womens-hair-lifestyle.jpg' },
      { id: 'sleep-skin', title: 'Sleep & Night Wellness', image: '/images/slide-skin.jpg' }
    ];

    const US_STATES = [
      { code: 'TX', name: 'Texas (TX) — Immediate Clinician Available' },
      { code: 'CA', name: 'California (CA) — Immediate Clinician Available' },
      { code: 'NY', name: 'New York (NY) — Immediate Clinician Available' },
      { code: 'FL', name: 'Florida (FL) — Immediate Clinician Available' },
      { code: 'IL', name: 'Illinois (IL) — Immediate Clinician Available' },
      { code: 'PA', name: 'Pennsylvania (PA)' },
      { code: 'OH', name: 'Ohio (OH)' },
      { code: 'GA', name: 'Georgia (GA)' },
      { code: 'NC', name: 'North Carolina (NC)' },
      { code: 'MI', name: 'Michigan (MI)' },
      { code: 'NJ', name: 'New Jersey (NJ)' },
      { code: 'VA', name: 'Virginia (VA)' },
      { code: 'WA', name: 'Washington (WA)' },
      { code: 'AZ', name: 'Arizona (AZ)' },
      { code: 'MA', name: 'Massachusetts (MA)' },
      { code: 'TN', name: 'Tennessee (TN)' },
      { code: 'IN', name: 'Indiana (IN)' },
      { code: 'MO', name: 'Missouri (MO)' },
      { code: 'MD', name: 'Maryland (MD)' },
      { code: 'WI', name: 'Wisconsin (WI)' },
      { code: 'CO', name: 'Colorado (CO)' },
      { code: 'MN', name: 'Minnesota (MN)' },
      { code: 'SC', name: 'South Carolina (SC)' },
      { code: 'AL', name: 'Alabama (AL)' },
      { code: 'LA', name: 'Louisiana (LA)' },
      { code: 'KY', name: 'Kentucky (KY)' },
      { code: 'OR', name: 'Oregon (OR)' },
      { code: 'OK', name: 'Oklahoma (OK)' },
      { code: 'CT', name: 'Connecticut (CT)' },
      { code: 'UT', name: 'Utah (UT)' },
      { code: 'NV', name: 'Nevada (NV)' }
    ];

    // HTML Sanitization helper against reflected DOM XSS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    // Read initial URL params
    const urlParams = new URLSearchParams(window.location.search);
    const rawCatParam = (urlParams.get('category') || 'HAIR').toUpperCase();
    const CAT_ALIASES = {
      HAIR_LOSS: 'HAIR',
      DERMATOLOGY: 'SKIN',
      SEXUAL_HEALTH_ED: 'SEXUAL_HEALTH',
      WEIGHT_MANAGEMENT: 'WEIGHT'
    };
    let currentCategory = CAT_ALIASES[rawCatParam] || rawCatParam;
    let currentAudience = (urlParams.get('audience') || 'HIM').toUpperCase();
    if (currentAudience !== 'HIM' && currentAudience !== 'HER') currentAudience = 'HIM';
    let initialConcern = urlParams.get('concern') || '';

    // Flow State
    let currentStepIndex = 0;
    let questionsFlow = [];
    const patientAnswers = {
      selectedConcerns: initialConcern ? [initialConcern] : [],
      uploadedPhotos: {}
    };

    // ----------------------------------------------------
    // BUILD QUESTIONNAIRE FLOW BASED ON CATEGORY & AUDIENCE
    // ----------------------------------------------------
    function buildFlow() {
      const isHair = currentCategory === 'HAIR';
      const isSkin = currentCategory === 'SKIN';
      const isSex = currentCategory === 'SEXUAL_HEALTH';
      const isWeight = currentCategory === 'WEIGHT';
      const isHim = currentAudience === 'HIM';

      const steps = [];

      // --------------------------------------------------
      // STEP 1: CONCERN SELECTION (WITH PHOTOS FOR SKIN, HAIR & SEXUAL HEALTH)
      // --------------------------------------------------
      if (isHair || isSkin || isSex) {
        let concernItems = [];
        if (isHair) {
          concernItems = isHim ? HAIR_CONCERNS_MEN : HAIR_CONCERNS_WOMEN;
        } else if (isSkin) {
          concernItems = isHim ? SKIN_CONCERNS_MEN : SKIN_CONCERNS_WOMEN;
        } else if (isSex) {
          concernItems = SEXUAL_HEALTH_CONCERNS;
        }

        steps.push({
          id: 'step_concern_selection',
          type: 'photo_grid_multi',
          title: "What's your concern?",
          subtitle: "Select all that apply.",
          items: concernItems,
          required: true
        });
      }

      // --------------------------------------------------
      // FLOW 1 & 2: HAIR LOSS (MEN / WOMEN)
      // --------------------------------------------------
      if (isHair) {
        steps.push({
          id: 'hair_goal',
          type: 'radio',
          title: "What's your hair goal?",
          options: ["Regrow lost hair", "Keep the hair I have", "Both"],
          required: true
        });

        // Q2: Areas noticing changes (Photo Image Grid from Reference Image 9)
        steps.push({
          id: 'hair_areas',
          type: 'photo_grid_single',
          title: "Where are you noticing changes?",
          subtitle: "Select the primary area of hair changes.",
          items: [
            { id: 'hairline', title: 'Hairline', image: '/images/intake/area-hairline.jpg' },
            { id: 'crown', title: 'Crown / top', image: '/images/intake/area-crown.jpg' },
            { id: 'thinning', title: 'Overall thinning', image: '/images/intake/area-overall-thinning.jpg' },
            { id: 'all-over', title: isHim ? 'All over' : 'Random diffuse loss', image: '/images/intake/area-all-over.jpg' }
          ],
          required: true
        });

        steps.push({
          id: 'hair_duration',
          type: 'radio',
          title: "How long has this been happening?",
          options: ["Less than 6 months", "6–12 months", "1–3 years", "3+ years"],
          required: true
        });

        steps.push({
          id: 'hair_scalp_problems',
          type: 'checkbox',
          title: "Do you have any scalp problems?",
          subtitle: "Select all that apply.",
          whyWeAsk: "Scalp issues can change which hair treatments are suitable for you.",
          options: ["None", "Dandruff", "Itching", "Redness", "Pain", "Rash"],
          required: true
        });

        // Interstitial Educational Slide
        steps.push({
          id: 'hair_interstitial_lifestyle',
          type: 'interstitial',
          title: "Next, let's talk about lifestyle factors.",
          subtitle: "Uncovering which root causes may be affecting you helps our medical doctors personalize your formula."
        });

        steps.push({
          id: 'hair_family',
          type: 'radio',
          title: "Does hair loss run in your family?",
          whyWeAsk: "Genetic sensitivity to DHT is responsible for over 90% of progressive hair loss.",
          options: ["Yes", "No", "Not sure"],
          required: true
        });

        steps.push({
          id: 'hair_format',
          type: 'radio',
          title: "How would you like to treat it?",
          options: ["Oral chew / tablet", "Topical drop / spray", "Both", "Not sure — help me choose"],
          required: true
        });

        steps.push({
          id: 'hair_treated_before',
          type: 'radio',
          title: "Have you treated hair loss before?",
          options: ["No, this is my first time", "Yes — and it worked", "Yes — but it did not work"],
          required: true
        });

        steps.push({
          id: 'hair_medical_conditions',
          type: 'checkbox',
          title: "Do you have any of these conditions?",
          subtitle: "Select all that apply.",
          whyWeAsk: "These can affect which hair treatment is clinically safe for you.",
          options: ["Liver disease", "Prostate condition", "Low blood pressure", "Heart condition", "None"],
          required: true
        });

        // Safety question based on audience
        if (isHim) {
          steps.push({
            id: 'hair_father_child',
            type: 'radio',
            title: "Are you planning to father a child soon?",
            safetyAlert: "Finasteride and dutasteride can affect fertility parameters, so the physician needs to know.",
            options: ["No", "Yes"],
            required: true
          });
        } else {
          steps.push({
            id: 'hair_pregnancy',
            type: 'radio',
            title: "Are you pregnant, planning to become pregnant, or breastfeeding?",
            safetyAlert: "Certain hair formulations like oral anti-androgens must not be used during pregnancy.",
            options: ["No", "Yes"],
            required: true
          });
        }

        // Q12: PHOTOS REQUIRED FOR HAIR (Matching Reference Image 10)
        steps.push({
          id: 'hair_photos',
          type: 'photo_upload',
          title: "Add photos of your hairline & crown",
          subtitle: "Required for hair clinical assessment — helps the doctor personalize your plan.",
          slots: [
            {
              id: 'photo_front',
              name: 'Front hairline',
              guide: 'Hold hair back so front hairline and temples are clearly visible in good lighting.',
              refImage: '/images/intake/ref-front-hairline.jpg'
            },
            {
              id: 'photo_crown',
              name: 'Top of scalp',
              guide: 'Tilt head forward so crown / vertex and part line are fully visible.',
              refImage: '/images/intake/ref-top-scalp.jpg'
            }
          ],
          required: true
        });
      }

      // --------------------------------------------------
      // FLOW 3 & 4: SKIN CARE (MEN / WOMEN)
      // --------------------------------------------------
      if (isSkin) {
        steps.push({
          id: 'skin_duration',
          type: 'radio',
          title: "How long have you had this concern?",
          options: ["Less than 3 months", "3–12 months", "Over a year", "Many years"],
          required: true
        });

        steps.push({
          id: 'skin_prev_treatment',
          type: 'radio',
          title: "Have you tried prescription treatment for this concern before?",

    // ----------------------------------------------------
    // RENDER CURRENT STEP
    // ----------------------------------------------------
    function renderStep() {
      const stage = document.getElementById('questionnaire-stage');
      const step = questionsFlow[currentStepIndex];
      const isLast = currentStepIndex === questionsFlow.length - 1;
      const isFirst = currentStepIndex === 0;

      // Update Header Progress Bar & Counter
      const totalSteps = questionsFlow.length - 1; // excluding results screen
      const currentNumber = Math.min(currentStepIndex + 1, totalSteps);
      document.getElementById('step-counter').innerText = `${currentNumber}/${totalSteps}`;
      const percent = Math.min(100, Math.round((currentNumber / totalSteps) * 100));
      document.getElementById('progress-bar-fill').style.width = `${percent}%`;

      // Back button visibility
      const btnBack = document.getElementById('btn-back');
      btnBack.style.visibility = isFirst ? 'hidden' : 'visible';

      // Action Bar visibility
      const actionBar = document.getElementById('bottom-action-bar');
      const btnContinue = document.getElementById('btn-continue');
      const btnSkip = document.getElementById('btn-secondary-skip');

      if (step.type === 'results') {
        actionBar.classList.add('hidden');
      } else {
        actionBar.classList.remove('hidden');
        btnSkip.classList.add('hidden');
      }

      // Render step HTML
      let html = '';

      // Slide Title & Subtitle Header (Omitted for Results and Interstitial Slides)
      if (step.type !== 'results' && step.type !== 'interstitial') {
        html += `
          <div class="mb-8 text-center sm:text-left">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-sans font-bold text-[#191817] tracking-tight leading-tight">
              ${step.title}
            </h1>
            ${step.subtitle ? `<p class="text-sm sm:text-base text-[#615C56] mt-2">${step.subtitle}</p>` : ''}
          </div>
        `;
      }

      // Safety Box if applicable
      if (step.safetyAlert) {
        html += `
          <div class="q-safety-box mb-6 flex items-start space-x-3 text-xs sm:text-sm font-medium">
            <svg class="w-5 h-5 shrink-0 text-red-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <div>
              <strong class="font-bold block">Important Safety Check:</strong>
              ${step.safetyAlert}
            </div>
          </div>
        `;
      }

      // ------------------------------------------------
      // TYPE: PHOTO_GRID_MULTI (Concern selection with photos)
      // ------------------------------------------------
      if (step.type === 'photo_grid_multi') {
        const selected = patientAnswers[step.id] || patientAnswers.selectedConcerns || [];
        html += `
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4">
            ${step.items.map(item => {
              const isChecked = selected.includes(item.title);
              return `
                <div class="q-photo-card ${isChecked ? 'selected' : ''}"

      // ------------------------------------------------

      else if (step.type === 'photo_grid_single') {

      // ------------------------------------------------

                </div>
              `;

          </div>

      // ------------------------------------------------

      else if (step.type === 'checkbox') {

        html += `
          <div class="space-y-3">

      // ------------------------------------------------
      // TYPE: INTERSTITIAL (Animated Text Matching Image 3)

      else if (step.type === 'interstitial') {

        const baseDelay = 120;

        html += `

            <!-- Warm Centered Animated Heading matching Image 3 -->

      // ------------------------------------------------

                       class="mt-1 w-4 h-4 rounded text-[#0F1B38] focus:ring-[#0F1B38]">
                <span class="text-xs text-[#615C56] leading-relaxed">
                  I confirm I am 18+ years of age and agree to an asynchronous telemedicine clinical consultation, the <a href="#" class="underline text-[#191817] font-semibold">Privacy Policy</a>, and <a href="#" class="underline text-[#191817] font-semibold">Prescription Terms</a>.
                </span>
              </label>
            </div>
          </div>
        `;
      }

      // ------------------------------------------------
      // TYPE: RESULTS (AI Clinical Overview & Treatment Recommendation)
      // ------------------------------------------------
      else if (step.type === 'results') {
        const rawConcern = (patientAnswers.selectedConcerns && patientAnswers.selectedConcerns[0]) || 'Clinical Profile';
        const concernTitle = escapeHtml(rawConcern);
        const stateName = escapeHtml(patientAnswers.state || 'NJ');

        // Hide bottom footer bar on results screen so primary cart CTA takes focus
        const footerNav = document.querySelector('footer');
        if (footerNav) footerNav.classList.add('hidden');

        const catToProd = {
          HAIR: 'HAIR_LOSS',
          SKIN: 'DERMATOLOGY',
          SEXUAL_HEALTH: 'SEXUAL_HEALTH_ED',
          WEIGHT: 'WEIGHT_MANAGEMENT'
        };
        const prodCat = catToProd[currentCategory] || 'HAIR_LOSS';
        const allProds = (typeof PRODUCTS !== 'undefined' && PRODUCTS.length) ? PRODUCTS : [];
        let recs = allProds.filter(p => p.category === prodCat && (p.audience === 'BOTH' || p.audience === currentAudience));
        if (!recs.length) recs = allProds.filter(p => p.category === prodCat);
        recs = recs.slice(0, 3);

        if (!window._aiSelectedCartIds) {
          window._aiSelectedCartIds = recs.length ? [recs[0].id] : [];
        }

        const aiSummaryMap = {
          HAIR: `AI Clinical Analysis reviewed your hair profile (${concernTitle}) and safety screening. A targeted DHT-modulating & follicle-stimulating regimen is recommended for optimal regrowth over 4–6 months.`,
          WEIGHT: `AI Clinical Analysis evaluated your metabolic profile, BMI goals, and contraindications. Physician-titrated GLP-1 therapy is recommended to regulate appetite and support sustainable weight reduction.`,
          SEXUAL_HEALTH: `AI Clinical Analysis reviewed your cardiovascular safety screen and performance goals (${concernTitle}). Targeted PDE-5 therapy is recommended for reliable onset and confidence.`,
          SKIN: `AI Clinical Analysis assessed your skin profile (${concernTitle}) and sensitivity markers. A dermatologist-grade retinoid and barrier-support protocol is recommended for cellular renewal.`
        };
        const aiNarrative = aiSummaryMap[currentCategory] || aiSummaryMap.HAIR;

        const selectedTotal = recs
          .filter(r => window._aiSelectedCartIds.includes(r.id))
          .reduce((sum, r) => sum + (r.priceInr || 999), 0);

        html += `
          <div class="space-y-6 max-w-3xl mx-auto pb-12">
            <!-- AI Overview Card -->
            <div class="bg-[#0F1B38] text-white rounded-[2rem] p-6 sm:p-8 shadow-xl space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <span class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-white/10 text-[#E89D5E] text-[11px] font-bold uppercase tracking-widest">
                  <span class="w-2 h-2 rounded-full bg-[#E89D5E] animate-pulse"></span>
                  <span>AI Clinical Overview</span>
                </span>
                <span class="text-xs text-white/75 font-medium">${stateName} Licensed Review Ready</span>
              </div>

              <div>
                <h2 class="text-2xl sm:text-3xl font-serif font-bold text-white leading-tight">
                  Your AI Treatment Recommendation
                </h2>
                <p class="text-sm text-white/85 mt-2.5 leading-relaxed">
                  ${aiNarrative}
                </p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                <div class="bg-white/10 rounded-2xl p-3.5">
                  <span class="text-[10px] uppercase tracking-wider text-white/60 block">Primary Focus</span>
                  <span class="text-xs font-bold text-white mt-0.5 block">${concernTitle}</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-3.5">
                  <span class="text-[10px] uppercase tracking-wider text-white/60 block">Clinical Safety</span>
                  <span class="text-xs font-bold text-emerald-300 mt-0.5 block">✓ Pre-Screened</span>
                </div>
                <div class="bg-white/10 rounded-2xl p-3.5">
                  <span class="text-[10px] uppercase tracking-wider text-white/60 block">Next Step</span>
                  <span class="text-xs font-bold text-[#E89D5E] mt-0.5 block">Add to Cart → Doctor Review</span>
                </div>
              </div>
            </div>

            <!-- AI Recommended Treatments -->
            <div class="bg-white rounded-[2rem] border border-[#DDD5C9] p-6 sm:p-8 shadow-sm space-y-5">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="text-lg sm:text-xl font-bold text-[#191817]">Recommended AIRO eMed Treatments</h3>
                  <p class="text-xs text-[#615C56] mt-0.5">Select the treatments to add to your cart for physician approval.</p>
                </div>
                <span class="text-xs font-bold text-[#0F1B38] bg-[#FAF8F5] px-3 py-1 rounded-full border border-[#DDD5C9]">
                  ${window._aiSelectedCartIds.length} selected
                </span>
              </div>

              <div class="space-y-3">
                ${recs.map((p, idx) => {
                  const inCart = window._aiSelectedCartIds.includes(p.id);
                  return `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 rounded-2xl border transition-all ${inCart ? 'border-[#0F1B38] bg-[#FAF8F5]' : 'border-[#EAE5DC] bg-white'}">
                      <div class="flex items-center space-x-4">
                        <img src="${p.image}" alt="${escapeHtml(p.title)}" class="w-16 h-16 rounded-xl object-cover bg-[#F5F2EB] shrink-0" />
                        <div>
                          <div class="flex items-center space-x-2">
                            ${idx === 0 ? '<span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-[#E89D5E]/25 text-[#191817]">98% AI Match</span>' : ''}
                            <span class="text-[10px] font-semibold text-[#615C56]">${escapeHtml(p.categoryLabel)}</span>
                          </div>
                          <h4 class="text-sm sm:text-base font-bold text-[#191817] mt-0.5">${escapeHtml(p.title)}</h4>
                          <p class="text-xs font-mono text-[#736E67] mt-0.5">${escapeHtml(p.ingredients)}</p>
                        </div>
                      </div>

                      <div class="flex items-center justify-between sm:justify-end gap-4 shrink-0">
                        <div class="text-left sm:text-right">
                          <span class="text-base font-bold text-[#191817] tabular-nums">₹${(p.priceInr || 999).toLocaleString('en-IN')}</span>
                          <span class="text-[11px] text-[#736E67] block">${escapeHtml(p.period || '/ month')}</span>
                        </div>
                        <button type="button" onclick="toggleAiCartItem('${p.id}')"
                          class="px-4 py-2 rounded-full text-xs font-bold transition-colors cursor-pointer ${inCart ? 'bg-[#0F1B38] text-white' : 'bg-[#EFECE6] text-[#191817] hover:bg-[#DDD5C9]'}">
                          ${inCart ? 'Added to Cart ✓' : '+ Add to Cart'}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Cart Total & Proceed CTA -->
              <div class="pt-4 border-t border-[#EAE5DC] flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <span class="text-xs text-[#615C56] block">Estimated Total (Doctor consult &amp; shipping included)</span>
                  <span class="text-2xl font-bold text-[#191817] tabular-nums">₹${selectedTotal.toLocaleString('en-IN')}</span>
                </div>
                <button type="button" onclick="proceedToCheckoutFromAI('${escapeHtml(aiNarrative.replace(/'/g, ''))}')"
                  class="px-7 py-4 rounded-full bg-[#0F1B38] hover:bg-[#1E40AF] text-white text-sm font-bold transition-all shadow-md cursor-pointer">
                  Proceed to Cart &amp; Sign In →
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // "Why we ask" box if present
      if (step.whyWeAsk) {
        html += `
          <div class="q-why-box mt-6 flex items-start space-x-3 text-xs sm:text-sm text-[#615C56]">
            <svg class="w-5 h-5 text-[#854D0E] shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <div>
              <strong class="font-bold text-[#191817] block mb-0.5">Why our doctors ask this:</strong>
              ${step.whyWeAsk}
            </div>
          </div>
        `;
      }

      stage.innerHTML = html;
      validateContinueBtn();
    }

    // ----------------------------------------------------
    // INTERACTION HANDLERS
    // ----------------------------------------------------
    function selectRadio(stepId, value) {
      patientAnswers[stepId] = value;
      renderStep();
      // Auto-advance after natural 200ms
      setTimeout(() => {
        handleContinue();
      }, 200);
    }

    function toggleCheckbox(stepId, value) {
      if (!patientAnswers[stepId]) patientAnswers[stepId] = [];
      const arr = patientAnswers[stepId];
      if (value === 'None' || value === 'None of these') {
        patientAnswers[stepId] = ['None'];
      } else {
        const noneIdx = arr.indexOf('None');
        if (noneIdx > -1) arr.splice(noneIdx, 1);
        const idx = arr.indexOf(value);
        if (idx > -1) {
          arr.splice(idx, 1);
        } else {
          arr.push(value);
        }
      }
      renderStep();
    }

    function selectSinglePhotoCard(stepId, value) {
      patientAnswers[stepId] = value;
      renderStep();
      setTimeout(() => {
        handleContinue();
      }, 200);
    }

    function toggleMultiPhotoCard(stepId, value) {
      if (!patientAnswers[stepId]) {
        patientAnswers[stepId] = patientAnswers.selectedConcerns && patientAnswers.selectedConcerns.length > 0 
          ? [...patientAnswers.selectedConcerns] 
          : [];
      }
      const arr = patientAnswers[stepId];
      const idx = arr.indexOf(value);
      if (idx > -1) {
        arr.splice(idx, 1);
      } else {
        arr.push(value);
      }
      patientAnswers.selectedConcerns = patientAnswers[stepId];
      renderStep();
    }

    function handleFileUpload(event, slotId) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        patientAnswers.uploadedPhotos[slotId] = {
          name: file.name,
          url: e.target.result
        };
        renderStep();
      };
      reader.readAsDataURL(file);
    }

    function updateMetric(field, value) {
      patientAnswers[field] = parseFloat(value);
      renderStep();
    }

    // ----------------------------------------------------
    // VALIDATION
    // ----------------------------------------------------
    function validateContinueBtn() {
      const step = questionsFlow[currentStepIndex];
      const btn = document.getElementById('btn-continue');
      if (!step || !btn) return;

      let isValid = true;

      if (step.type === 'interstitial') {
        isValid = true;
        const btnText = document.getElementById('btn-continue-text');
        if (btnText) btnText.innerText = 'Next';
      } else {
        const btnText = document.getElementById('btn-continue-text');
        if (btnText) btnText.innerText = 'Continue';

        if (step.type === 'photo_grid_multi') {
          const arr = patientAnswers[step.id] || patientAnswers.selectedConcerns || [];
          isValid = arr.length > 0;
        } else if (step.type === 'radio' || step.type === 'photo_grid_single') {
          isValid = Boolean(patientAnswers[step.id]);
        } else if (step.type === 'checkbox') {
          const arr = patientAnswers[step.id] || [];
          isValid = arr.length > 0;
        } else if (step.type === 'photo_upload') {
          // PHOTOS ARE REQUIRED FOR SKIN & HAIR!
          const uploadedCount = Object.keys(patientAnswers.uploadedPhotos || {}).length;
          isValid = uploadedCount >= (step.slots ? step.slots.length : 1);
        } else if (step.type === 'final_step') {
          isValid = Boolean(patientAnswers.termsAgreed);
        }
      }

      btn.disabled = !isValid;
    }

    // ----------------------------------------------------
    // NAVIGATION
    // ----------------------------------------------------
    function handleContinue() {
      const step = questionsFlow[currentStepIndex];
      const btn = document.getElementById('btn-continue');
      if (btn.disabled) return;

      if (currentStepIndex < questionsFlow.length - 1) {
        currentStepIndex++;
        renderStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function goBack() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        window.location.href = '/concerns.html';
      }
    }

    function skipOptionalStep() {
      handleContinue();
    }

    function toggleAiCartItem(prodId) {
      if (!window._aiSelectedCartIds) window._aiSelectedCartIds = [];
      const idx = window._aiSelectedCartIds.indexOf(prodId);
      if (idx > -1) {
        window._aiSelectedCartIds.splice(idx, 1);
      } else {
        window._aiSelectedCartIds.push(prodId);
      }
      renderStep();
    }

    function proceedToCheckoutFromAI(aiOverviewText) {
      const allProds = (typeof PRODUCTS !== 'undefined' && PRODUCTS.length) ? PRODUCTS : [];
      const selectedIds = window._aiSelectedCartIds || [];
      const cartItems = selectedIds
        .map(id => allProds.find(p => p.id === id))
        .filter(Boolean)
        .map(p => ({
          id: p.id,
          title: p.title,
          ingredients: p.ingredients,
          priceInr: p.priceInr || 999,
          price: p.price || 15,
          period: p.period || '/ month',
          image: p.image,
          category: p.category,
          audience: p.audience,
          qty: 1,
          addedByDoctor: false
        }));

      if (!cartItems.length && allProds.length) {
        const p = allProds[0];
        cartItems.push({
          id: p.id, title: p.title, ingredients: p.ingredients,
          priceInr: p.priceInr || 999, price: p.price || 15,
          period: p.period || '/ month', image: p.image,
          category: p.category, audience: p.audience, qty: 1, addedByDoctor: false
        });
      }

      const payload = {
        category: currentCategory,
        audience: currentAudience,
        concerns: patientAnswers.selectedConcerns || [],
        dob: patientAnswers.dob || '1995-05-08',
        state: patientAnswers.state || 'NJ',
        answers: patientAnswers,
        aiOverview: aiOverviewText,
        cart: cartItems,
        createdAt: new Date().toISOString()
      };
      localStorage.setItem('airo_active_checkout', JSON.stringify(payload));
      window.location.href = '/checkout.html';
    }

    // Initialize flow on page load
    buildFlow();
    renderStep();
  </script>

</body>
</html>
